name: Feature Request
description: Propose a new analytical metric, repository category, export format, or enhancement
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to Gerrit-It!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem or limitation you are facing.
      placeholder: I am unable to quantify contributions to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution or Metric
      description: Describe what you would like Gerrit-It to do.
      placeholder: Add support for repository pattern X or scholarship window Y...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links to relevant Gerrit queries, documentation, or scholarship requirements.
    validations:
      required: false
